<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email triage — render &amp; capture</title>
<!--
  Stage 3 render+capture artifact document (S64, #202 direction A — bake-config).

  This is a per-run document, NOT a static shell. present.assemble.build_artifact_doc
  bakes two things into it before handing it to create_artifact by path:
    1. the widget IIFE (public/triage-widget.js) at the IIFE marker, and
    2. the aliased initTriage config JSON at the config marker.
  So nothing is fetched at runtime: the config does not ride OneDrive sync and
  is never agent-transcribed (the file is handed over by path). The only
  transport leg left is the ~3 KB submit, emitted back via the S144 fallback
  chain (Microsoft 365 connector -> OneDrive _scratch; #376 recovery-paste floor;
  host: local MCP gated off until #430 routes it).

  build_artifact_doc replaces two markers, each appearing EXACTLY ONCE below
  (the IIFE-marker in the first script, the config-marker in the tw-config
  script) — do NOT repeat the literal marker tokens anywhere else in this file
  (e.g. here in this comment): the replace is first-occurrence and the builder
  asserts a single occurrence, so a stray copy would mis-bake or fail the build.
  assemble / alias / decision_log all stay in Python (agent land). The only JS
  here is the sendPrompt shim plus the initTriage bootstrap.
-->
<style>
:root{
  color-scheme: light;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --border-radius-md: 6px;
  --border-radius-lg: 10px;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #555a60;
  --color-text-tertiary: #8a9099;
  --color-text-info: #1a5fb4;
  --color-text-success: #1a6b1a;
  --color-text-warning: #8a6d00;
  --color-text-danger: #a1170f;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f2f3f5;
  --color-background-info: #e8f0fe;
  --color-background-success: #e6f4e6;
  --color-background-warning: #fbf3da;
  --color-background-danger: #fde3e1;
  --color-border-info: #1a5fb4;
  --color-border-secondary: #cfd3d8;
  --color-border-tertiary: #e3e6ea;
}
body{background:var(--color-background-primary);margin:0;padding:14px;font-family:var(--font-sans)}
#tw-status{font:12px/1.5 var(--font-sans);margin-bottom:10px;padding:8px 10px;border-radius:8px;
  background:var(--color-background-secondary);color:var(--color-text-secondary)}
#tw-status.err{background:var(--color-background-danger);color:var(--color-text-danger)}
#tw-status.ok{background:var(--color-background-success);color:var(--color-text-success)}
/* #376 recovery block: the raw signal string, on the page, before any transport
   runs. Collapsed by default so it costs no attention on the happy path. */
#tw-recover{font:12px/1.5 var(--font-sans);margin-bottom:10px}
#tw-recover[hidden]{display:none}
#tw-recover summary{cursor:pointer;color:var(--color-text-secondary);padding:4px 0}
#tw-recover textarea{width:100%;box-sizing:border-box;height:90px;font:11px/1.4 var(--font-mono);
  border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px;
  background:var(--color-background-secondary);color:var(--color-text-primary)}
#tw-recover button{font:12px var(--font-sans);margin-top:4px;padding:4px 10px;cursor:pointer;
  border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);
  background:var(--color-background-primary);color:var(--color-text-primary)}
</style>
</head>
<body>
<div id="tw-status">Decide each card, then Submit page.</div>
<details id="tw-recover" hidden>
  <summary>Raw submit string (recovery copy — paste to the agent if transport failed)</summary>
  <textarea id="tw-recover-text" readonly spellcheck="false"></textarea>
  <button type="button" id="tw-recover-copy">Copy</button>
</details>
<div id="tw-root"></div>

<script>
/* __TRIAGE_WIDGET_IIFE__ */
</script>

<script type="application/json" id="tw-config">/* __TRIAGE_CONFIG_JSON__ */</script>

<script>
(function () {
  "use strict";
  // Canonical working dir on the synced OneDrive mount (the drain's glob root).
  // Per-page append-only (#214): each page submit writes its OWN file here (never
  // overwrites), so a page finished before the artifact dies survives. The agent
  // drains every artifact-submit-* file (de-alias against the one baked alias map
  // -> decision_log per file). Retained for reference: the S144 connector leg
  // addresses this dir by driveId + parentItemId (baked in cfg), not by path.
  var SUBMIT_DIR = "PARA-meta/email-triage-snapshots/_scratch"; // eslint-disable-line no-unused-vars

  // Stamp of the baked snapshot, set at boot from the config; namespaces the
  // per-page submit files so concurrent snapshots never collide.
  var stamp = null;
  var submitCount = 0;

  // S144 (#427) — the emission fallback chain, all baked into cfg at assemble.
  //   transportOrder: ordered leg names tried by uploadSubmit; the recovery-paste
  //     floor is the terminal leg. Default keeps host: OFF (it 422s at publish and
  //     is upstream-unrouted, #430); it becomes ["host","connector","recovery"]
  //     only once #430 clears AND the manifest declares host:.
  //   driveId / scratchItemId: the canonical OneDrive _scratch, for the connector
  //     leg's sharepoint_upload_file (resolved fresh at assemble via
  //     sharepoint_folder_search — the itemId is stable but assemble owns it).
  var transportOrder = ["connector", "recovery"];
  var driveId = null;
  var scratchItemId = null;

  function status(msg, cls) {
    var s = document.getElementById("tw-status");
    s.textContent = msg;
    s.className = cls || "";
  }

  // #376 — park the raw signal string on the page BEFORE any transport call.
  // The gate widget (and this one) have no localStorage resume, so a transport
  // failure after the decisions are made costs the whole pass unless the string
  // survives somewhere the operator can reach. With this, it costs a paste.
  // Deliberately unconditional and first: it must not depend on the leg that
  // just failed, and it must already be on the page when the failure is read.
  function parkRecoveryCopy(signal) {
    try {
      var box = document.getElementById("tw-recover");
      var ta = document.getElementById("tw-recover-text");
      if (!box || !ta) { return; }
      ta.value = signal;
      box.hidden = false;
    } catch (e) { console.warn("[shell] recovery copy failed to render:", e); }
  }

  (function wireRecoveryCopy() {
    var btn = document.getElementById("tw-recover-copy");
    if (!btn) { return; }
    btn.addEventListener("click", function () {
      var ta = document.getElementById("tw-recover-text");
      if (!ta) { return; }
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value); ok = true; }
      btn.textContent = ok ? "Copied ✓" : "Select all + ⌘C";
      setTimeout(function () { btn.textContent = "Copy"; }, 2000);
    });
  })();

  // The widget calls a global sendPrompt(); the published artifact has none, so
  // we shim it. batch: -> emit via the fallback chain; details: -> graceful note.
  //
  // S142/S143: the published-artifact MCP api (claude.use("mcp") + callTool)
  // rejects on failure with an error carrying a `code`. Absence codes (leg not
  // wired / server unreachable / declaration missing) mean "try the next leg
  // quietly"; any other code is a reached-but-failed leg, surfaced loudly — but
  // the chain still falls through to the recovery floor so a live failure never
  // costs the decisions.
  function errCode(e) { return (e && (e.code || (e.error && e.error.code))) || ""; }
  function isAbsence(e) {
    var c = String(errCode(e)).toLowerCase();
    return c === "not_in_manifest" || c === "server_not_connected" ||
           c === "not_connected" || c === "unavailable" || c === "not_found";
  }
  function errText(e) { return errCode(e) || (e && e.message) || String(e); }

  window.sendPrompt = function (text) {
    try {
      if (typeof text === "string" && text.indexOf("batch:") === 0) { uploadSubmit(text); }
      else if (typeof text === "string" && text.indexOf("details:") === 0) {
        status("Details requested for " + text.slice("details:".length) +
               " — details round-trip is not wired in this build.", "");
      } else { console.log("[shell] sendPrompt:", text); }
    } catch (e) { status("sendPrompt error: " + e, "err"); }
  };

  async function uploadSubmit(signal) {
    // #376 / S140: park the recovery copy FIRST — unconditionally, before ANY
    // guard or transport leg can return early. A runtime-absent submit must still
    // leave the operator a paste on the page; the park must not depend on the leg
    // that just failed, and must already be on the page when a failure is read.
    parkRecoveryCopy(signal);
    var rows = null;
    try { rows = JSON.parse(signal.slice("batch:".length)); } catch (e) {}
    var n = Array.isArray(rows) ? rows.length : "?";
    // Unique per-page index: never overwrite a prior page's submit. The
    // monotonic count keeps files ordered (the server / fallback stamp the ts).
    var seq = ("000" + (++submitCount)).slice(-3);
    status("Writing page (" + n + " decisions)…", "");

    // The canonical filename EVERY file-writing leg lands, so the drain globs them
    // identically (`artifact-submit-*`). The host: put_submit leg passes
    // {stamp,seq,payload} and the server rebuilds this same name server-side.
    var fname = "artifact-submit-" + (stamp || "nostamp") + "-p" + seq + "-" + Date.now() + ".json";

    // S144 (#427): the published-artifact MCP namespace -- the PROVEN page-side
    // api (claude.use("mcp") + callTool), NOT window.cowork. null => not served/
    // granted/loaded; every MCP leg then no-ops through to the recovery floor.
    var mcp = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        mcp = await window.claude.use("mcp");
      }
    } catch (e) { console.info("[shell] claude.use(mcp) threw -- MCP legs will skip:", e); }

    // Ordered fallback chain (#427). Legs are tried in transportOrder; each MCP
    // leg falls through on failure; the recovery-paste floor (already parked at
    // the top) is the terminal leg. Success on any leg short-circuits the rest.
    var order = (Array.isArray(transportOrder) && transportOrder.length)
      ? transportOrder : ["connector", "recovery"];
    var loud = []; // reached-but-errored legs, surfaced if we end on the floor

    for (var i = 0; i < order.length; i++) {
      var leg = order[i];

      if (leg === "recovery") {
        // Terminal floor: the raw signal is already parked at the top of the fn.
        // Reaching here means no MCP leg landed -- this page did not auto-transport.
        submitCount--;
        if (loud.length) {
          status("⚠ transport ERRORED (" + loud.join("; ") + ") -- your " + n +
                 " decisions are parked below. Copy them out and hand them to the agent.", "err");
        } else {
          status("No automated transport is wired -- your " + n + " decisions are " +
                 "parked below. Copy them out and hand them to the agent.", "err");
        }
        return;
      }

      if (!mcp) { continue; } // both MCP legs need the resolved namespace

      if (leg === "host") {
        // Leg 1 -- host: local MCP. PREFERRED once #430 routes host:<local-server>;
        // gated OFF today (absent from the default order AND the manifest, so a
        // stray attempt rejects not_in_manifest -> quiet skip). The server stamps
        // the canonical filename from {stamp,seq,payload}.
        try {
          await mcp.callTool("host:triage-transport", "put_submit",
            { stamp: stamp || "nostamp", seq: seq, payload: signal });
          status("Page submitted ✓ (local transport) -- " + n + " decisions. " +
                 submitCount + " page(s) this sitting. The agent drains + logs each page.", "ok");
          return;
        } catch (e) {
          if (isAbsence(e)) { console.info("[shell] host: leg absent -- next:", e); }
          else { loud.push("host: " + errText(e)); console.warn("[shell] host: leg ERRORED -- next:", e); }
        }
        continue;
      }

      if (leg === "connector") {
        // Leg 2 -- Microsoft 365 connector (S143 proven primary). The publishable
        // class the host: publish-gate does not touch; sharepoint_upload_file writes
        // the canonical file straight into the OneDrive _scratch the drain already
        // globs. The page builds the filename; driveId + scratch itemId baked in cfg.
        try {
          await mcp.callTool("Microsoft 365", "sharepoint_upload_file", {
            driveId: driveId,
            parentItemId: scratchItemId,
            filename: fname,
            content: signal,
            conflictBehavior: "fail"
          });
          status("Page submitted ✓ (connector) -- " + n + " decisions written to _scratch/" +
                 fname + ". " + submitCount + " page(s) this sitting. The agent drains + logs each page.", "ok");
          return;
        } catch (e) {
          if (isAbsence(e)) { console.info("[shell] connector leg absent -- next:", e); }
          else { loud.push("connector: " + errText(e)); console.warn("[shell] connector leg ERRORED -- next:", e); }
        }
        continue;
      }

      console.warn("[shell] unknown transport leg in cfg.transportOrder:", leg);
    }

    // Order exhausted with no "recovery" terminal (defensive: cfg omitted it).
    // Decisions are still parked at the top -- surface loudly, never silently.
    submitCount--;
    if (loud.length) {
      status("⚠ all transport legs failed (" + loud.join("; ") + ") -- decisions parked below; paste to the agent.", "err");
    } else {
      status("No transport leg landed -- decisions parked below; paste to the agent.", "err");
    }
  }

  function boot() {
    if (typeof window.initTriage !== "function") {
      status("Widget IIFE did not load (window.initTriage missing).", "err");
      return;
    }
    var cfg;
    try {
      cfg = JSON.parse(document.getElementById("tw-config").textContent);
    } catch (e) { status("Baked config did not parse: " + e, "err"); return; }
    stamp = cfg.stamp || null;
    // S144 (#427): the emission fallback chain's baked config. Absent => the
    // safe default (connector primary, recovery floor; host: OFF).
    if (Array.isArray(cfg.transportOrder) && cfg.transportOrder.length) {
      transportOrder = cfg.transportOrder;
    }
    driveId = cfg.driveId || null;
    scratchItemId = cfg.scratchItemId || null;
    var n = (cfg.emails || []).length;
    status("Loaded " + n + " of " + (cfg.total != null ? cfg.total : "?") +
           " (stamp " + (cfg.stamp || "?") + "). Decide each card, then Submit page " +
           "— each page is saved on its own, so you can stop any time.", "");
    window.initTriage(cfg);
  }

  boot();
})();
</script>
</body>
</html>
